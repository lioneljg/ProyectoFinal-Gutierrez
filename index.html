<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de reservas</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="./js/script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <h1 class="text-center">Simulador de reservas para barbería</h1>
    
    <div class="container">
        <!-- Sección de servicios disponibles -->
        <div class="servicios-disponibles mb-5">
            <h2 class="text-center mb-4">Nuestros Servicios</h2>
            <div id="indicadorCarga" class="text-center">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando servicios...</span>
                </div>
                <p class="mt-2">Cargando servicios disponibles...</p>
            </div>
            <div id="contenedorServicios" class="row g-3" style="display: none;"></div>
        </div>

        <div class="formulario-reserva">
            <h2 class="text-center mb-4">Reservá tu turno</h2>
            
            <form id="formularioReserva">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="col-md-6">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" required>
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="fecha" class="form-label">Fecha</label>
                        <input type="date" class="form-control" id="fecha" required>
                    </div>
                    <div class="col-md-6">
                        <label for="hora" class="form-label">Hora</label>
                        <select class="form-select" id="hora" required>
                            <option value="">Seleccioná una hora</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="barbero" class="form-label">Barbero</label>
                        <select class="form-select" id="barbero" required>
                            <option value="">Seleccioná un barbero</option>
                        </select>
                        <div id="infoBarbero" class="form-text"></div>
                    </div>
                    <div class="col-md-6">
                        <label for="servicio" class="form-label">Servicio</label>
                        <select class="form-select" id="servicio" required>
                            <option value="">Seleccioná un servicio</option>
                        </select>
                        <div id="infoServicio" class="form-text"></div>
                    </div>
                </div>

                <!-- Resumen del precio -->
                <div id="resumenPrecio" class="alert alert-info" style="display: none;">
                    <h5>Resumen de tu reserva:</h5>
                    <div id="detalleReserva"></div>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                    <button type="submit" class="btn btn-primary btn-lg">Reservar Turno</button>
                    <button type="button" class="btn btn-secondary btn-lg" id="verReservas">Ver Reservas</button>
                </div>
            </form>
        </div>

        <!-- Sección para mostrar reservas -->
        <div id="listaReservas" class="mt-4" style="display: none;">
            <h3>Reservas guardadas</h3>
            <div id="contenidoReservas"></div>
        </div>
    </div>
</body>

</html>
